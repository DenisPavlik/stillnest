<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stillnest — оживлений кадр цілком</title>

<!--
  The full-frame bake-off. Not part of the site; public/lab/ is deleted before
  a release.

  It crops exactly the way the real interior band crops -- 100svh, cover,
  anchored to the bottom, never taller than 4:3 -- because on a 2560x1080
  ultrawide that crop throws away the top of the picture, and the top of the
  picture is where the flue pipe is. A take judged in a video player is judged
  in a frame the site never shows.
-->

<style>
  :root { --spruce: #0d1310; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--spruce); color: #e8e4dc; overflow: hidden;
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }

  #stage { position: relative; width: 100vw; height: 100svh;
    max-height: calc(100vw / 1.35); overflow: hidden; background: var(--spruce); }

  #stage > img, #stage > video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center bottom; display: none;
  }
  #stage > .on { display: block; }

  /* The other framing: the whole photograph, nothing cropped. Useful for
     checking the parts the site hides rather than for judging the site. */
  body.whole #stage { max-height: none; }
  body.whole #stage > img, body.whole #stage > video { object-fit: contain; }

  #hud { position: fixed; left: 16px; bottom: 16px; z-index: 9;
    background: rgba(6,10,8,.86); border: 1px solid rgba(232,228,220,.14);
    border-radius: 8px; padding: 12px 14px; max-width: 46ch;
    backdrop-filter: blur(6px); }
  #hud b { color: #f3efe6; }
  #hud hr { border: 0; border-top: 1px solid rgba(232,228,220,.14); margin: 8px 0; }
  kbd { display: inline-block; min-width: 1.5em; text-align: center;
    background: rgba(232,228,220,.1); border: 1px solid rgba(232,228,220,.2);
    border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; margin-right: 2px; }
  .miss { color: #8b8378; }
</style>

<div id="stage"></div>
<div id="hud">завантаження…</div>

<script>
(async () => {
  const stage = document.getElementById("stage");
  const hud = document.getElementById("hud");

  const man = await fetch("/lab/alive.json").then((r) => r.ok ? r.json() : null).catch(() => null);
  if (!man) { hud.textContent = "немає /lab/alive.json — спершу запусти animate.py"; return; }

  const photo = document.createElement("img");
  photo.src = man.photo;
  photo.className = "on";
  stage.append(photo);

  // Every take is loaded and left playing; switching only shows and hides, so
  // flicking between two of them compares two fires, not two loading states.
  const layers = [photo];
  for (const t of man.takes) {
    const v = document.createElement("video");
    Object.assign(v, { src: t.src, muted: true, loop: true, playsInline: true, preload: "auto" });
    v.addEventListener("loadedmetadata", () => { t.dims = `${v.videoWidth}×${v.videoHeight}`; draw(); });
    v.addEventListener("error", () => { t.broken = true; draw(); });
    v.play().catch(() => {});
    stage.append(v);
    layers.push(v);
  }

  let cur = 0;
  function show(i) {
    if (i < 0 || i >= layers.length) return;
    cur = i;
    layers.forEach((el, n) => el.classList.toggle("on", n === i));
    draw();
  }

  /* Ukrainian, because it is the owner who reads it. Code stays English. */
  function draw() {
    const rows = man.takes.map((t, i) => {
      // Past nine there is no key left to press, so the arrows are the real
      // navigation and the digit is only a shortcut for the first nine.
      const k = i < 9 ? `<kbd>${i + 1}</kbd>` : `<kbd>&nbsp;</kbd>`;
      if (t.broken) return `${k} <span class="miss">${t.label} — файл не знайдено</span>`;
      const now = cur === i + 1 ? "<b>" : "";
      const end = cur === i + 1 ? "</b>" : "";
      return `${k} ${now}${t.label}${end} <span class="miss">${t.dims || "…"} · ${t.cost || ""}</span>`;
    }).join("<br>");
    hud.innerHTML =
      `<div><b>${cur === 0 ? "0 · фотографія, недоторкана" : man.takes[cur - 1].label}</b>` +
      `<span class="miss"> &nbsp;${cur + 1}/${layers.length}</span></div><hr>` +
      `<kbd>0</kbd> ${cur === 0 ? "<b>фотографія</b>" : "фотографія"}<br>${rows}<hr>` +
      `<kbd>↑</kbd><kbd>↓</kbd> перебирати все підряд &nbsp; <kbd>Space</kbd> далі<br>` +
      `<kbd>W</kbd> ${document.body.classList.contains("whole")
        ? "<b>увесь кадр</b> — не те, що бачить відвідувач"
        : "як кадрує сайт — верх обрізано"}<br>` +
      `<kbd>H</kbd> сховати це`;
  }

  const step = (d) => show((cur + d + layers.length) % layers.length);

  addEventListener("keydown", (e) => {
    const k = e.key;
    if (/^[0-9]$/.test(k)) show(+k);
    else if (k === "ArrowDown" || k === "ArrowRight" || k === " ") step(1);
    else if (k === "ArrowUp" || k === "ArrowLeft") step(-1);
    else if (k === "w" || k === "W") { document.body.classList.toggle("whole"); draw(); }
    else if (k === "h" || k === "H")
      hud.style.display = hud.style.display === "none" ? "" : "none";
    else return;
    e.preventDefault();
  });

  show(0);
})();
</script>
