<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stillnest — сніг на фотографії</title>

<!-- Still images, not video: the question here is whether the weather can be put
     INTO the photograph, so that the animator has something to move instead of
     something to invent. Same crop as the site, same keys as alive.html. -->

<style>
  :root { --spruce: #0d1310; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:var(--spruce); color:#e8e4dc; overflow:hidden;
    font:13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #stage { position:relative; width:100vw; height:100svh;
    max-height:calc(100vw / 1.35); overflow:hidden; background:var(--spruce); }
  #stage > img { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center bottom; display:none; }
  #stage > img.on { display:block; }
  body.whole #stage { max-height:none; }
  body.whole #stage > img { object-fit:contain; }
  /* 1:1 pixels — the only way to judge whether a flake survives at full size. */
  body.one #stage > img { object-fit:none; object-position:var(--ox,50%) var(--oy,50%); }
  #hud { position:fixed; left:16px; bottom:16px; z-index:9;
    background:rgba(6,10,8,.86); border:1px solid rgba(232,228,220,.14);
    border-radius:8px; padding:12px 14px; max-width:52ch; backdrop-filter:blur(6px); }
  #hud b { color:#f3efe6; }
  #hud hr { border:0; border-top:1px solid rgba(232,228,220,.14); margin:8px 0; }
  kbd { display:inline-block; min-width:1.5em; text-align:center;
    background:rgba(232,228,220,.1); border:1px solid rgba(232,228,220,.2);
    border-bottom-width:2px; border-radius:4px; padding:0 4px; margin-right:2px; }
  .miss { color:#8b8378; }
</style>

<div id="stage"></div>
<div id="hud">завантаження…</div>

<script>
(async () => {
  const stage = document.getElementById("stage");
  const hud = document.getElementById("hud");
  const man = await fetch("/lab/snowshots.json").then(r => r.ok ? r.json() : null).catch(() => null);
  if (!man) { hud.textContent = "немає /lab/snowshots.json"; return; }

  const layers = man.takes.map((t, i) => {
    const im = document.createElement("img");
    im.src = t.src;
    im.addEventListener("loadedmetadata", draw);
    im.addEventListener("load", () => { t.dims = `${im.naturalWidth}×${im.naturalHeight}`; draw(); });
    if (i === 0) im.className = "on";
    stage.append(im);
    return im;
  });

  let cur = 0;
  const show = (i) => {
    cur = (i + layers.length) % layers.length;
    layers.forEach((el, n) => el.classList.toggle("on", n === cur));
    draw();
  };

  function draw() {
    const rows = man.takes.map((t, i) =>
      `${i < 9 ? `<kbd>${i + 1}</kbd>` : "<kbd>&nbsp;</kbd>"} ` +
      `${cur === i ? "<b>" : ""}${t.label}${cur === i ? "</b>" : ""} ` +
      `<span class="miss">${t.dims || "…"}</span>`).join("<br>");
    hud.innerHTML =
      `<div><b>${man.takes[cur].label}</b><span class="miss"> &nbsp;${cur + 1}/${layers.length}</span></div><hr>` +
      rows + "<hr>" +
      `<kbd>↑</kbd><kbd>↓</kbd> перебирати &nbsp; <kbd>Space</kbd> далі<br>` +
      `<kbd>W</kbd> ${document.body.classList.contains("whole") ? "<b>увесь кадр</b>" : "як кадрує сайт"} &nbsp; ` +
      `<kbd>1:1</kbd> клавіша <kbd>P</kbd> ${document.body.classList.contains("one") ? "<b>піксель у піксель</b> — водити мишею" : "піксель у піксель"}<br>` +
      `<kbd>H</kbd> сховати це`;
  }

  addEventListener("mousemove", (e) => {
    if (!document.body.classList.contains("one")) return;
    document.body.style.setProperty("--ox", `${(e.clientX / innerWidth) * 100}%`);
    document.body.style.setProperty("--oy", `${(e.clientY / innerHeight) * 100}%`);
  });

  addEventListener("keydown", (e) => {
    const k = e.key;
    if (/^[1-9]$/.test(k)) show(+k - 1);
    else if (k === "ArrowDown" || k === "ArrowRight" || k === " ") show(cur + 1);
    else if (k === "ArrowUp" || k === "ArrowLeft") show(cur - 1);
    else if (k === "w" || k === "W") { document.body.classList.remove("one"); document.body.classList.toggle("whole"); draw(); }
    else if (k === "p" || k === "P") { document.body.classList.remove("whole"); document.body.classList.toggle("one"); draw(); }
    else if (k === "h" || k === "H") hud.style.display = hud.style.display === "none" ? "" : "none";
    else return;
    e.preventDefault();
  });

  show(0);
})();
</script>
